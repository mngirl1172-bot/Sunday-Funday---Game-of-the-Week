name: Update FOX matchups and publish board

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fox-board-publish
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install announcement image reader
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Verify all 18 weeks
        id: verify
        continue-on-error: true
        run: python -u update_matchups.py
      - name: Save verified schedule and check status
        run: |
          git config user.name 'FOX board updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-of-the-week.json matchup-update-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified FOX matchups and kickoff times'
            git push
          fi
      - name: Prepare public board files
        run: |
          mkdir -p public
          cp index.html board.html game-of-the-week.json matchup-update-status.json public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish board
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report any verification failures
        if: steps.verify.outcome == 'failure'
        run: |
          cat matchup-update-status.json
          exit 1
