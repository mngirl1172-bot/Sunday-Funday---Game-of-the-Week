<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOX Game of the Week Pick a Square</title>
<style>body{margin:0;background:#07070a;color:#fff;font-family:Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}.status{padding:30px}.error{color:#ffb3b3;max-width:700px;line-height:1.5}</style>
</head>
<body>
<div class="status" id="status">Loading FOX Game of the Week board…</div>
<script>
(async()=>{
  try{
    const [boardResponse,scheduleResponse]=await Promise.all([
      fetch(`board.html?v=${Date.now()}`,{cache:'no-store'}),
      fetch(`game-of-the-week.json?v=${Date.now()}`,{cache:'no-store'})
    ]);
    if(!boardResponse.ok) throw new Error(`Board HTTP ${boardResponse.status}`);
    if(!scheduleResponse.ok) throw new Error(`Schedule HTTP ${scheduleResponse.status}`);
    let board=await boardResponse.text();
    const games=await scheduleResponse.json();
    if(!Array.isArray(games)||games.length!==18) throw new Error('Schedule data is invalid.');
    const replacement=`const games = ${JSON.stringify(games)};`;
    const pattern=/const games = \[.*?\];/s;
    if(!pattern.test(board)) throw new Error('Could not locate board schedule.');
    board=board.replace(pattern,replacement);
    document.open();
    document.write(board);
    document.close();
  }catch(err){
    document.getElementById('status').innerHTML=`<div class="error"><h2>Board could not load</h2><p>${String(err.message||err)}</p><p>Please refresh the page.</p></div>`;
    console.error(err);
  }
})();
</script>
</body>
</html>
